name: Release
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin main --tags
      - uses: pnpm/action-setup@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Configure npm auth
        run: |
          # Write auth to ~/.npmrc (home dir, not version-controlled) so the
          # NPM token is never written into the project's .npmrc file, which
          # would leak the secret into a git commit and trip push protection.
          mkdir -p ~/.npm
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Version packages (if changesets pending)
        id: version
        run: |
          if pnpm changeset status --verbose > status.log 2>&1; then
            if grep -q "There are no changesets to be released" status.log; then
              echo "versioned=false" >> "$GITHUB_OUTPUT"
              echo "No pending changesets; nothing to version or publish."
            else
              pnpm changeset version
              echo "versioned=true" >> "$GITHUB_OUTPUT"
              echo "Version bumped; committing and publishing."
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add .
              git commit -m "chore: version packages" || echo "no changes to commit"
              git push
            fi
          else
            echo "versioned=false" >> "$GITHUB_OUTPUT"
            echo "changeset status failed; skipping (see status.log)"
            cat status.log
          fi
      - name: Publish to npm
        if: steps.version.outputs.versioned == 'true'
        run: pnpm changeset publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
