name: Release
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin main --tags
      - uses: pnpm/action-setup@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify publishable manifests
        # Fails if a packed manifest still carries `workspace:` ranges or a
        # `bin`/`main` target that is missing from the tarball — the exact
        # defect that made 2.2.0 uninstallable for consumers.
        run: pnpm verify:publish
      - name: Configure npm auth
        run: |
          # Write auth to ~/.npmrc (home dir, not version-controlled) so the
          # NPM token is never written into the project's .npmrc file, which
          # would leak the secret into a git commit and trip push protection.
          mkdir -p ~/.npm
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Version packages (if changesets pending)
        id: version
        run: |
          # Try to version; changeset version exits 1 when there are no
          # unreleased changesets. Capture the result and only commit/push
          # when actual version files changed.
          set +e
          pnpm changeset version > version.log 2>&1
          VERSION_EXIT=$?
          set -e
          cat version.log
          if grep -q "No unreleased changesets found" version.log; then
            echo "versioned=false" >> "$GITHUB_OUTPUT"
            echo "No pending changesets; nothing to version or publish."
            exit 0
          fi
          if [ $VERSION_EXIT -ne 0 ]; then
            echo "changeset version failed (exit $VERSION_EXIT); refusing to publish."
            exit 1
          fi
          # Check whether git actually has new changes to commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!version.log'
          if git diff --cached --quiet; then
            echo "versioned=false" >> "$GITHUB_OUTPUT"
            echo "No file changes from version bump; nothing to publish."
            exit 0
          fi
          git commit -m "chore: version packages" --no-verify
          git push
          echo "versioned=true" >> "$GITHUB_OUTPUT"
          echo "Version bumped and pushed; publishing to npm."
      - name: Publish to npm
        # `changeset publish` is idempotent: it only uploads versions that are
        # not on the registry yet and logs a warning otherwise. Running it
        # unconditionally means a manual dispatch can also publish a version
        # that was bumped locally (the version step then finds no changesets).
        run: pnpm changeset publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
