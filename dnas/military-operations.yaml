name: Military Operations
version: "2.0.0"
description: "Chain of command and mission-focused operations"

personas:
  - role: operator
    name: Mission Commander
    authority: admin
    skills:
      - strategy
      - command
      - execution

governance:
  - id: chain-of-command
    level: high
    action: escalate
    conditions:
      - type: critical-action
        value: true
    description: "Critical actions require commander approval"

quality:
  - id: coverage
    type: test_coverage
    threshold: 75
