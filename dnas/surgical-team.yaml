name: Surgical Team
version: "2.0.0"
description: "Zero-defect governance with sterile field protocols"

personas:
  - role: architect
    name: Lead Surgeon
    authority: architect
    boundaries:
      - id: max-modules
        type: max_modules
        value: 1
    skills:
      - surgical-procedure
      - team-leadership
      - clinical-decision

governance:
  - id: sterile-field
    level: critical
    action: block
    conditions:
      - type: production
        value: true
    description: "Block any non-approved production changes"
  - id: timeout-verification
    level: high
    action: escalate
    conditions:
      - type: deployment
        value: true
    description: "Escalate all deployment actions"

quality:
  - id: zero-defect
    type: test_coverage
    threshold: 100
  - id: no-lint
    type: lint
    threshold: 0
  - id: no-security
    type: security
    threshold: 0

pipelines:
  - id: surgical-construction
    name: Surgical Construction Pipeline
    description: "Minimal pipeline with maximum safety — architecture required before any construction"
    appliesTo: ["web-app", "api", "mobile", "microservice", "library"]
    phases:
      - id: arch
        name: Pre-operative Architecture
        type: architecture
        order: 0
        requiredAgents: ["architect"]
        requiredSkills: ["engineering-cycle"]
        gates:
          - id: adr-required
            name: ADR before any code
            phaseType: architecture
            blocking: true
            condition:
              type: file-exists
              value: adr/
              description: "At least one Architecture Decision Record required"
        readinessArtifact: adr/
        blocking: true
      - id: deps
        name: Sterile Dependency Check
        type: dependencies
        order: 1
        requiredAgents: ["operator"]
        requiredSkills: ["verification-first"]
        gates:
          - id: dep-vulnerability
            name: No vulnerable dependencies
            phaseType: dependencies
            blocking: true
            condition:
              type: security
              value: 0
              description: "Zero known vulnerabilities in dependencies"
        readinessArtifact: package.json
        blocking: true
      - id: build
        name: Controlled Construction
        type: backend
        order: 2
        requiredAgents: ["architect"]
        requiredSkills: ["engineering-cycle"]
        gates:
          - id: test-coverage
            name: 100% coverage enforced
            phaseType: testing
            blocking: true
            condition:
              type: test_coverage
              value: 100
              description: "100% test coverage required"
        blocking: true

workflows:
  - id: surgery
    name: Surgical Protocol
    steps:
      - id: "1"
        name: Pre-op
        required: true
        approvalRequired: true
      - id: "2"
        name: Procedure
        required: true
      - id: "3"
        name: Post-op
        required: true
