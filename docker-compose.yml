services:
  behavioros-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # The MCP server is stdio-only and reads BEHAVIOROS_DNA_PATH.
      - BEHAVIOROS_DNA_PATH=/app/dnas/enterprise-governance.yaml
    volumes:
      - .:/app
      - /app/node_modules
    command: ["pnpm", "mcp:start"]

  behavioros-tests:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - /app/node_modules
    command: ["pnpm", "test"]
    environment:
      - CI=true
